name: release
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: pnpm i
      - run: pnpm build
      - uses: raviqqe/pnpm-publish@v1.0.2
        with:
          release: ${{ github.ref == 'refs/heads/main' }}
